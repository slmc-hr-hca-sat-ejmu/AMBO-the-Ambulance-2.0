<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMBO - Automated Module-Based Outcome</title>
    <style>
        :root { --primary-blue: #00d4ff; --emergency-red: #ff3e3e; --warning-gold: #ffcc00; --success-green: #27ae60; --bg-dark: #0f0f0f; }
        
        /* Fixed UI for 100% Zoom Auto-Fit - Maximized Interface */
        body { display: flex; justify-content: center; align-items: center; height: 100dvh; margin: 0; background: var(--bg-dark); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; touch-action: none; }
        .container { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 520px; height: 100dvh; padding: 75px 0 20px 0; box-sizing: border-box; }
        
        canvas { background: #1a1a1a; border: 3px solid #333; border-radius: 16px; box-shadow: 0 0 40px rgba(0,212,255,0.15); width: 96%; max-height: calc(100dvh - 120px); height: 100%; aspect-ratio: 360 / 580; object-fit: contain; display: block; }
        
        .hud-header-tag { position: absolute; top: 15px; left: 2%; right: 2%; display: flex; justify-content: space-between; align-items: center; font-size: 14px; background: rgba(30, 30, 30, 0.9); padding: 12px 18px; border-radius: 8px; border: 1px solid #444; z-index: 50; }
        .stats-bar { width: 96%; display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; font-weight: bold; }
        .stat-red { color: var(--emergency-red); } .stat-blue { color: var(--primary-blue); }
        
        #mainOverlay { position: absolute; top: 90px; left: 2%; right: 2%; bottom: 35px; background: rgba(10, 10, 10, 0.96); border: 2px solid var(--primary-blue); border-radius: 20px; display: flex; flex-direction: column; padding: 25px; z-index: 100; backdrop-filter: blur(8px); overflow-y: auto; }
        
        .story-header { font-size: 24px; color: var(--emergency-red); font-weight: 900; text-align: center; margin-bottom: 15px; text-transform: uppercase; }
        .story-text { font-size: 16px; color: #eee; margin-bottom: 20px; line-height: 1.6; text-align: center; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border-left: 4px solid var(--primary-blue); min-height: 80px; }
        .option-btn { background: #252525; text-align: left; margin-bottom: 12px; padding: 16px; border-radius: 10px; font-size: 15px; border: 1px solid #444; width: 100%; color: white; cursor: pointer; transition: background 0.2s; line-height: 1.4; }
        .option-btn:hover { background: #333; }
        .option-btn.disabled { opacity: 0.5; cursor: not-allowed; background: #151515; }
        #feedbackMsg { font-weight: bold; text-align: center; margin-bottom: 15px; font-size: 18px; display: none; padding: 10px; border-radius: 8px; }
        .correct { color: var(--success-green); background: rgba(39, 174, 96, 0.1); }
        .wrong { color: var(--emergency-red); background: rgba(255, 62, 62, 0.1); }
        .form-group { margin-bottom: 16px; text-align: left; width: 100%; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: var(--primary-blue); margin-bottom: 8px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 16px; border-radius: 8px; border: 1px solid #444; background: #111; color: white; box-sizing: border-box; font-size: 16px; }
        .ambo-avatar { width: 60px; height: 90px; margin: 0 auto 20px; position: relative; background: #fff; border-radius: 6px; border: 2px solid #ccc; flex-shrink: 0; }
        .ambo-avatar::after { content: ''; position: absolute; top: 40px; left: 0; width: 100%; height: 14px; background: var(--emergency-red); }
        .siren-light { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 40px; height: 10px; border-radius: 5px; animation: flickerSiren 0.3s infinite alternate; }
        @keyframes flickerSiren { 0% { background: var(--emergency-red); box-shadow: 0 0 15px var(--emergency-red); } 100% { background: var(--primary-blue); box-shadow: 0 0 15px var(--primary-blue); } }
        .progress-container { width: 96%; height: 12px; background: #222; border-radius: 10px; margin-top: 15px; border: 1px solid #333; overflow: hidden; flex-shrink: 0; }
        #progressBar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-blue), #00ff88); transition: width 0.4s ease; }
        .game-btn { padding: 18px 24px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; color: white; text-transform: uppercase; letter-spacing: 1px; }
        .btn-green { background: var(--success-green); width: 100%; margin-top: 15px; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3); }
        .result-data-box { background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 12px; padding: 20px; margin: 20px 0; width: 90%; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: var(--primary-blue); animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #countdownValue { font-size: 48px; font-weight: bold; color: var(--primary-blue); margin-top: 10px; }
        
        .audio-toggle-btn { position: absolute; top: -1px; right: 8px; background: transparent; border: none; border-radius: 8px; color: var(--primary-blue); font-size: 20px; font-weight: bold; padding: 4px; cursor: pointer; z-index: 200; display: flex; align-items: center; justify-content: center; }
        .audio-toggle-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="container">
    <div class="hud-header-tag">
        <span id="hudModuleTitle">SYSTEMS & TECHNICAL</span>
        <span id="hudPlayerID" style="margin-right: 35px;">ID: ---</span>
        <button class="audio-toggle-btn" id="audioToggleBtn" onclick="toggleAudioStream()">🔊</button>
    </div>
    <div class="stats-bar">
        <div class="stat-item stat-red">💓 STABILITY: <span id="stabilityDisplay">0</span>%</div>
        <div class="stat-item stat-blue">🏁 <span id="dist">0</span>m</div>
    </div>
    <canvas id="game" width="360" height="580"></canvas>
    
    <div class="progress-container"><div id="progressBar"></div></div>

    <div id="mainOverlay">
        <div id="screenStart" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center;">
            <div class="ambo-avatar"><div class="siren-light"></div></div>
            <h1 style="margin: 0; color: #fff; font-size: 36px;">🚑 AMBO</h1>
            <p style="color: var(--warning-gold); font-size: 13px; margin-bottom: 30px; letter-spacing: 1px;">Automated Module-Based Outcome</p>
            <button class="game-btn btn-green" id="startMissionBtn" onclick="engageAudioAndProceed()" disabled>LOADING CLOUD CACHE...</button>
        </div>
        
        <div id="screenDetails" style="display: none; flex-direction: column; justify-content: center; height: 100%;">
            <div class="story-header">DEPLOYMENT</div>
            <div class="form-group">
                <label>Training Module</label>
                <select id="trainingModule">
                    <option value="sample_questions">Sample Questions</option>
                    <option value="acute_care">Acute Care</option>
                    <option value="acute_surgical">Acute/Surgical Care</option>
                    <option value="emergency">Emergency Care</option>
                    <option value="ambulatory">Ambulatory Care</option>
                    <option value="medical_technologist">Medical Technologist</option>
                    <option value="basic">Basic Navigation</option>
                    <option value="shiftmanager">Shift Manager Roles</option>
                    <option value="discharge">Discharge Officer</option>
                </select>
            </div>
            <div class="form-group"><label>Assigned Site</label><select id="playerSite"><option value="QC">St. Luke's - QC</option><option value="GC">St. Luke's - GC</option></select></div>
            <div class="form-group"><label>Player Number</label><input type="number" id="playerNum" inputmode="numeric" placeholder="Enter employee number"></div>
            <button class="game-btn btn-green" onclick="validateDetails()">CONFIRM DISPATCH</button>
        </div>
        
        <div id="screenBriefing" style="display: none; flex-direction: column; justify-content: center; height: 100%;">
            <div class="ambo-avatar"><div class="siren-light"></div></div>
            <div id="briefingHeaderTitle" class="story-header">🚨 MISSION BRIEFING 🚨</div>
            <div id="storyContent" class="story-text"></div>
            <button id="storyBtn" class="game-btn btn-green" onclick="nextStory()">CONTINUE</button>
        </div>
        
        <div id="screenQuiz" style="display: none; flex-direction: column; justify-content: center; height: 100%;">
            <div id="feedbackMsg"></div>
            <div id="qText" style="font-size: 18px; margin-bottom: 15px; font-weight: bold; line-height: 1.5;"></div>
            <div id="optionsContainer" style="overflow-y: auto; max-height: 60vh;"></div>
            <button id="quizNextBtn" class="game-btn btn-green" style="display: none; margin-top: 15px; flex-shrink:0;" onclick="advanceQuizSequence()">CONTINUE TO NEXT QUESTION</button>
        </div>
        
        <div id="screenLoading" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center;">
            <div class="spinner"></div>
            <div style="font-size: 16px; letter-spacing: 1px; color: #aaa; text-transform: uppercase;">Returning to the driver's seat</div>
            <div id="countdownValue">5</div>
        </div>
        
        <div id="screenResult" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center;">
            <div class="story-header" style="color: var(--success-green); font-size: 26px;">MISSION ACCOMPLISHED!</div>
            <div class="result-data-box">
                <div id="finalPlayerDisplay" style="color: var(--primary-blue); font-size: 20px; font-weight: bold; margin-bottom: 15px;">ID: ---</div>
                <div style="display: flex; justify-content: space-around;">
                    <div><div id="finalStability" style="font-size: 42px; font-weight: bold; color: #fff;">0%</div><p style="font-size: 11px; color: #aaa; margin:0;">STABILITY</p></div>
                    <div><div id="finalSync" style="font-size: 42px; font-weight: bold; color: var(--warning-gold);">0/0</div><p style="font-size: 11px; color: #aaa; margin:0;">SYSTEM SYNC</p></div>
                </div>
            </div>
            <button id="genBtn" class="game-btn btn-green" onclick="processValidation()">VALIDATE & SYNC</button>

            <div id="codeDisplayArea" style="display: none; margin-top: 20px; width: 90%;">
                <p style="font-size: 13px; color: #aaa; margin-bottom: 8px;">YOUR UNIQUE SYNC CODE:</p>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="syncCodeInput" readonly style="flex: 1; padding: 15px; border-radius: 8px; border: 1px solid var(--primary-blue); background: #111; color: var(--warning-gold); font-weight: bold; text-align: center; font-size: 20px;">
                    <button class="game-btn btn-green" onclick="copyCode()" style="margin: 0; padding: 15px; width: auto;">COPY</button>
                </div>
                <button class="game-btn btn-green" style="margin-top: 15px; width: 100%;" onclick="goToForm()">PROCEED TO FORM</button>
            </div>
        </div>
    </div>
</div>

<script>
    const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRfU0TSbaFOFzD_TNDaoHm_4xyxhl4YkaNLtTHd40t4rMlzbYxnxmwbOFgd1mQMurxFu5kerZT7ufM8/pub?gid=0&single=true&output=csv";

    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    const distText = document.getElementById('dist'), stabText = document.getElementById('stabilityDisplay');
    const hudPlayerID = document.getElementById('hudPlayerID'), hudModuleTitle = document.getElementById('hudModuleTitle');
    const progBar = document.getElementById('progressBar'), mainOverlay = document.getElementById('mainOverlay'), feedbackMsg = document.getElementById('feedbackMsg');

    let distance = 0, stability = 0, currentQuestionIndex = 0, syncScore = 0;
    let isPaused = true, inQuiz = false, gameStarted = false, arriving = false, midMilestonePause = false;
    let roadOffset = 0, spawnTimer = 0, hospitalY = -600, nextMilestone = 1000, firstAttempt = true, batchCount = 0;
    let playerIDValue = "", currentQuestionSet = [], questionLogs = [], firstChoiceLogs = [], storyPart = 0;
    let finalLoggedStability = 0, finalLoggedSyncScore = 0, allQuestions = {}; 
    let masterModuleQuestionsLength = 0;
    let globalDestinationURL = "";

    let audioStream = null;
    let audioIsMuted = false;

    function engageAudioAndProceed() {
        if (!audioStream) {
            audioStream = new Audio("Measured_Response.mp3");
            audioStream.loop = true;
            audioStream.volume = 0.40;
            audioStream.play().catch(err => {
                console.warn("Audio interaction delay protection triggered:", err);
            });
        }
        showScreen('screenDetails');
    }

    function toggleAudioStream() {
        if (!audioStream) return;
        if (audioIsMuted) {
            audioStream.muted = false;
            audioIsMuted = false;
            document.getElementById('audioToggleBtn').innerText = "🔊";
        } else {
            audioStream.muted = true;
            audioIsMuted = true;
            document.getElementById('audioToggleBtn').innerText = "🔇";
        }
    }

    async function initializeCloudAssets() {
        try {
            const resp = await fetch(csvUrl);
            const csvText = await resp.text();
            parseCloudCSV(csvText);
            const startBtn = document.getElementById('startMissionBtn');
            startBtn.innerText = "START MISSION";
            startBtn.disabled = false;
        } catch(e) {
            console.error("Asset matrix deployment connection exception:", e);
            alert("Error: Unable to securely pull validation assets. Check connection parameters.");
        }
    }

    function parseCloudCSV(text) {
        const mappedData = {};
        let moduleCounters = {};
        
        let lines = [];
        let row = [];
        let inQuotes = false;
        let currentCell = '';

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let nextC = text[i + 1];

            if (inQuotes) {
                if (c === '"') {
                    if (nextC === '"') {
                        currentCell += '"';
                        i++; 
                    } else {
                        inQuotes = false;
                    }
                } else {
                    currentCell += c;
                }
            } else {
                if (c === '"') {
                    inQuotes = true;
                } else if (c === ',') {
                    row.push(currentCell.trim());
                    currentCell = '';
                } else if (c === '\r' || c === '\n') {
                    row.push(currentCell.trim());
                    currentCell = '';
                    if (row.length > 1 && row.some(cell => cell !== "")) {
                        lines.push(row);
                    }
                    row = [];
                    if (c === '\r' && nextC === '\n') {
                        i++; 
                    }
                } else {
                    currentCell += c;
                }
            }
        }
        
        if (currentCell || row.length > 0) {
            row.push(currentCell.trim());
            if (row.some(cell => cell !== "")) lines.push(row);
        }

        for (let i = 1; i < lines.length; i++) {
            let cells = lines[i];
            if (cells.length < 7 || !cells[0]) continue;

            let moduleKey = cells[0].trim();
            if (!moduleCounters[moduleKey]) moduleCounters[moduleKey] = 0;

            let questionObj = {
                dbIndex: moduleCounters[moduleKey],
                q: cells[1],
                a: [cells[2], cells[3], cells[4], cells[5]].filter(Boolean),
                correct: parseInt(cells[6])
            };

            if (!mappedData[moduleKey]) mappedData[moduleKey] = [];
            mappedData[moduleKey].push(questionObj);
            moduleCounters[moduleKey]++;
        }
        allQuestions = mappedData;
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function getMilestoneStory(dist) {
        const stories = {
            1000: `"AMBO System here. You've cleared the worst of the starting highway traffic! <b>Heads up:</b> We are getting close to the hospital network zone. Get ready to answer your first training question!"`,
            2000: `"Great driving, Pilot! You just hit the 2,000-meter mark. The hospital needs a quick update on your clinical settings. Take a deep breath and get ready for the next round of questions."`,
            3000: `"We are moving fast now! The city streets are getting narrower and more crowded up ahead. Keep your eyes on the road and stay sharp—the next training checkpoint is opening right now!"`,
            4000: `"4,000 meters down! You can actually see the hospital's radio antennas from here. The medical staff needs to double-check your current progress data before you get any closer. Let's start the next quiz!"`,
            5000: `"Final stretch! The ambulance bay is just around the corner. Let's finish this last set of questions perfectly so we can secure a safe landing and clear the patient's intake!"`
        };
        return stories[dist] || `"Target distance reached! The AMBO backup system needs a quick data sync to keep everything running smoothly. Focus up, Pilot!"`;
    }

    const ambulance = { x: 162, y: 480, w: 36, h: 70, speed: 7 };
    let traffic = []; const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    canvas.addEventListener('touchmove', (e) => {
        if (isPaused || arriving) return;
        const rect = canvas.getBoundingClientRect();
        const touchX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
        ambulance.x = touchX - (ambulance.w / 2);
        if (ambulance.x < 15) ambulance.x = 15;
        if (ambulance.x > canvas.width - ambulance.w - 15) ambulance.x = canvas.width - ambulance.w - 15;
        e.preventDefault();
    }, { passive: false });

    function getBriefingText() { 
        return [
            `"System online. Connection established. <b>Hello, Pilot ${playerIDValue}!</b> I am AMBO, your Automated Module-Based Outcome unit"`,
            `"<b>How to move:</b> Use the <b>Left/Right Arrow Keys</b> or swipe horizontally on mobile."`,
            `"Avoid collisions! Every impact results in a <b>-100m distance deduction</b>, delaying our arrival."`,
            `"<b>The Sync Standard</b>: Only the <b>first answer</b> you choose counts toward your System Sync score."`
        ]; 
    }

    function showScreen(id) {
        ['screenStart', 'screenDetails', 'screenBriefing', 'screenQuiz', 'screenLoading', 'screenResult'].forEach(s => document.getElementById(s).style.display = 'none');
        document.getElementById(id).style.display = 'flex';
    }

    function validateDetails() {
        const val = document.getElementById('playerNum').value;
        const modKey = document.getElementById('trainingModule').value;
        if (!val) { alert("Enter employee number"); return; }
        playerIDValue = val;
        hudPlayerID.innerText = "ID: " + val;
        hudModuleTitle.innerText = document.getElementById('trainingModule').options[document.getElementById('trainingModule').selectedIndex].text.toUpperCase();
        
        let originalPool = allQuestions[modKey] || [];
        if (originalPool.length === 0) {
            alert("No configuration vectors found matching selected assignment module targets.");
            return;
        }
        
        masterModuleQuestionsLength = originalPool.length;
        currentQuestionSet = shuffleArray([...originalPool]);
        
        questionLogs = new Array(masterModuleQuestionsLength).fill("UNANSWERED"); 
        firstChoiceLogs = new Array(masterModuleQuestionsLength).fill("UNANSWERED");
        
        currentQuestionIndex = 0;
        syncScore = 0;
        distance = 0;
        nextMilestone = 1000;
        midMilestonePause = false;
        showStoryPart(); showScreen('screenBriefing');
    }

    function showStoryPart() {
        const texts = getBriefingText();
        document.getElementById('briefingHeaderTitle').innerText = "🚨 MISSION BRIEFING 🚨";
        document.getElementById('storyContent').innerHTML = texts[storyPart];
        document.getElementById('storyBtn').innerText = storyPart === texts.length - 1 ? "🚀 DEPLOY AMBO" : "NEXT";
    }

    function nextStory() {
        if (midMilestonePause) {
            midMilestonePause = false;
            showScreen('screenQuiz');
            showQuestion();
        } else {
            const texts = getBriefingText();
            if (storyPart < texts.length - 1) { storyPart++; showStoryPart(); } 
            else { mainOverlay.style.display = 'none'; isPaused = false; gameStarted = true; }
        }
    }

    function triggerCheckpoint() {
        inQuiz = true; isPaused = true; batchCount = 0;
        mainOverlay.style.display = 'flex'; 
        
        midMilestonePause = true;
        showScreen('screenBriefing');
        document.getElementById('briefingHeaderTitle').innerText = "📍 MILESTONE REACHED";
        document.getElementById('storyContent').innerHTML = getMilestoneStory(nextMilestone - 1000);
        document.getElementById('storyBtn').innerText = "ENGAGE SYNC QUIZ";
    }

    function showQuestion() {
        if (currentQuestionIndex >= currentQuestionSet.length) { arriving = true; resumeGame(); return; }
        firstAttempt = true;
        document.getElementById('quizNextBtn').style.display = "none"; 
        
        const q = currentQuestionSet[currentQuestionIndex];
        document.getElementById('qText').innerHTML = `<span style="color:var(--primary-blue)">SYSTEM SYNC...</span><br>Question ${currentQuestionIndex + 1} of ${currentQuestionSet.length}: ${q.q}`;
        const container = document.getElementById('optionsContainer'); container.innerHTML = '';
        
        let shuffledOptions = shuffleArray([...q.a]);
        shuffledOptions.forEach((opt) => {
            const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => handleAnswer(opt, btn); container.appendChild(btn);
        });
    }

    function handleAnswer(selectedText, clickedButton) {
        const qData = currentQuestionSet[currentQuestionIndex];
        const correctText = qData.a[qData.correct];
        const isCorrect = (selectedText === correctText);
        let targetSlot = qData.dbIndex;

        if (firstAttempt) {
            questionLogs[targetSlot] = isCorrect ? "CORRECT" : "WRONG";
            firstChoiceLogs[targetSlot] = selectedText || "EMPTY_CHOICE";
        }

        if (isCorrect) {
            if (firstAttempt) { syncScore++; }
            feedbackMsg.innerText = "✓ DATA VALIDATED"; feedbackMsg.className = "correct"; feedbackMsg.style.display = "block";
            stability = Math.round((syncScore / currentQuestionSet.length) * 100);
            stabText.innerText = stability;
            
            const buttons = document.getElementById('optionsContainer').getElementsByTagName('button');
            for(let btn of buttons) { btn.classList.add('disabled'); btn.onclick = null; }
            clickedButton.style.background = "var(--success-green)";
            
            document.getElementById('quizNextBtn').style.display = "block";
        } else {
            if (firstAttempt) {
                firstAttempt = false;
                stability = Math.round((syncScore / currentQuestionSet.length) * 100);
                stabText.innerText = stability;
            }
            feedbackMsg.innerText = "✗ SYSTEM LOCK: MISMATCH DETECTED"; feedbackMsg.className = "wrong"; feedbackMsg.style.display = "block";
            clickedButton.style.background = "var(--emergency-red)";
        }
    }

    function advanceQuizSequence() {
        feedbackMsg.style.display = "none";
        currentQuestionIndex++; batchCount++;
        
        if (currentQuestionIndex >= currentQuestionSet.length) {
            arriving = true;
            resumeGame();
        } else if (batchCount < 5) { 
            showQuestion(); 
        } else { 
            resumeGame(); 
        }
    }

    function resumeGame() {
        inQuiz = false;
        if (arriving) {
            finalLoggedStability = stability;
            finalLoggedSyncScore = syncScore;
            mainOverlay.style.display = 'none'; isPaused = false;
        } else {
            runLoadingTimer();
        }
    }

    function runLoadingTimer() {
        showScreen('screenLoading');
        let remainingSeconds = 5;
        document.getElementById('countdownValue').innerText = remainingSeconds;
        
        let timerInterval = setInterval(() => {
            remainingSeconds--;
            document.getElementById('countdownValue').innerText = remainingSeconds;
            
            if(remainingSeconds <= 0) {
                clearInterval(timerInterval);
                mainOverlay.style.display = 'none'; 
                isPaused = false; 
            }
        }, 1000);
    }

    function processValidation() {
        const modKey = document.getElementById('trainingModule').value;
        const siteKey = document.getElementById('playerSite').value;
        const genBtn = document.getElementById('genBtn'); 
        genBtn.innerText = "SYNCING DATA..."; 
        genBtn.disabled = true;

        const scriptURL = "https://script.google.com/macros/s/AKfycbyaX-yrbpjVWwQj9SKuXPKPOCCgXsAY5NqntnXyE1meihoTAta0B4WPziGBdyJsA-w/exec"; 
        
        const formData = new URLSearchParams();
        formData.append('id', playerIDValue);
        formData.append('stab', finalLoggedStability);
        formData.append('sync', finalLoggedSyncScore);
        formData.append('total', masterModuleQuestionsLength);
        formData.append('mod', modKey);
        formData.append('site', siteKey);
        formData.append('choices', JSON.stringify(firstChoiceLogs));
        formData.append('logs', JSON.stringify(questionLogs));

        fetch(scriptURL, { method: 'POST', body: formData, mode: 'no-cors' })
            .then(() => {
                const uniqueCode = playerIDValue + "-" + finalLoggedStability + "-" + finalLoggedSyncScore;
                globalDestinationURL = "https://docs.google.com/forms/d/e/1FAIpQLSfsapGwGN0CfhuiUieVz0xU8zRaMs9-qGva90XiNclQm-O2gA/viewform?entry.1802927237=" + playerIDValue + "&entry.556276856=" + encodeURIComponent(uniqueCode);
                
                genBtn.style.display = 'none';
                document.getElementById('codeDisplayArea').style.display = 'block';
                document.getElementById('syncCodeInput').value = uniqueCode;
            })
            .catch(error => {
                console.error('Error syncing:', error);
                alert("Sync error. Please check your connection.");
                genBtn.innerText = "VALIDATE & SYNC"; 
                genBtn.disabled = false;
            });
    }

    function copyCode() {
        const copyText = document.getElementById("syncCodeInput");
        copyText.select();
        copyText.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(copyText.value).then(() => {
            alert("Code copied to clipboard: " + copyText.value);
        });
    }

    function goToForm() {
        if(globalDestinationURL) {
            window.top.location.href = globalDestinationURL;
        }
    }

    function drawAmbulance() {
        let light = (Math.floor(Date.now()/200)%2) ? '#ff3e3e' : '#00d4ff';
        ctx.fillStyle = light; ctx.fillRect(ambulance.x+6, ambulance.y-6, 24, 6);
        ctx.fillStyle = '#fff'; ctx.fillRect(ambulance.x, ambulance.y, ambulance.w, ambulance.h);
        ctx.fillStyle = '#ff3e3e'; ctx.fillRect(ambulance.x, ambulance.y+35, ambulance.w, 12);
        ctx.fillStyle = '#333'; ctx.fillRect(ambulance.x+4, ambulance.y+8, ambulance.w-8, 20);
    }
    
    function drawCar(car) {
        ctx.fillStyle = car.color; ctx.fillRect(car.x, car.y, car.w, car.h);
        ctx.fillStyle = '#add8e6'; ctx.fillRect(car.x+4, car.y+8, car.w-8, 12);
        ctx.fillStyle = '#fff'; ctx.fillRect(car.x+4, car.y+car.h-6, 4, 3); ctx.fillRect(car.x+car.w-8, car.y+car.h-6, 4, 3);
    }
    
    function drawHospital() {
        ctx.fillStyle = '#1e293b'; ctx.fillRect(10, hospitalY, 340, 500);
        ctx.fillStyle = '#0f172a'; ctx.fillRect(10, hospitalY, 340, 20);
        ctx.fillRect(10, hospitalY + 90, 340, 10);
        ctx.fillStyle = '#0284c7'; ctx.fillRect(25, hospitalY + 30, 310, 45);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 15px "Segoe UI", sans-serif'; ctx.textAlign = 'center';
        ctx.fillText("ST. LUKE'S MEDICAL CENTER", 180, hospitalY + 58);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(172, hospitalY + 115, 16, 45); 
        ctx.fillRect(157, hospitalY + 130, 46, 16); 
        ctx.fillStyle = '#38bdf8';
        const startYPosition = hospitalY + 190;
        for (let structuralRow = 0; structuralRow < 4; structuralRow++) {
            for (let buildingColumn = 0; buildingColumn < 6; buildingColumn++) {
                let winX = 35 + (buildingColumn * 50);
                let winY = startYPosition + (structuralRow * 55);
                ctx.fillRect(winX, winY, 32, 30);
                ctx.fillStyle = '#e0f2fe';
                ctx.fillRect(winX + 2, winY + 2, 28, 4);
                ctx.fillStyle = '#38bdf8'; 
            }
        }
        ctx.fillStyle = '#475569'; ctx.fillRect(90, hospitalY + 410, 180, 90);
        ctx.fillStyle = '#0f172a'; ctx.fillRect(105, hospitalY + 430, 150, 70); 
    }

    function update() {
        if (isPaused || !gameStarted || inQuiz) return;
        if (arriving) {
            traffic = [];
            if (hospitalY < 20) { hospitalY += 3; roadOffset += 4; } 
            else { if (ambulance.y > 450) { ambulance.y -= 1.5; } else { isPaused = true; document.getElementById('finalStability').innerText = finalLoggedStability + "%"; document.getElementById('finalSync').innerText = `${finalLoggedSyncScore}/${masterModuleQuestionsLength}`; document.getElementById('finalPlayerDisplay').innerText = "PLAYER ID: " + playerIDValue; showScreen('screenResult'); mainOverlay.style.display = 'flex'; } }
        } else {
            if (keys['ArrowLeft'] && ambulance.x > 15) ambulance.x -= ambulance.speed;
            if (keys['ArrowRight'] && ambulance.x < canvas.width - ambulance.w - 15) ambulance.x += ambulance.speed;
            distance += 4; roadOffset += 12;
            
            if (distance >= nextMilestone && currentQuestionIndex < currentQuestionSet.length) {
                nextMilestone += 1000;
                triggerCheckpoint();
            }
            
            spawnTimer++;
            if (spawnTimer > 40) {
                const colors = ['#f39c12', '#8e44ad', '#27ae60', '#d35400'];
                traffic.push({ x: Math.random()*(canvas.width-50) + 10, y: -100, w: 34, h: 65, speed: 5 + Math.random()*2, color: colors[Math.floor(Math.random()*4)] });
                spawnTimer = 0;
            }
            for (let i = traffic.length-1; i >= 0; i--) {
                traffic[i].y += traffic[i].speed;
                if (ambulance.x < traffic[i].x + traffic[i].w && ambulance.x + ambulance.w > traffic[i].x && ambulance.y < traffic[i].y + traffic[i].h && ambulance.y + ambulance.h > traffic[i].y) { distance = Math.max(0, distance - 100); traffic.splice(i, 1); } else if (traffic[i].y > canvas.height) traffic.splice(i, 1);
            }
        }
        distText.innerText = Math.floor(distance);
        progBar.style.width = (currentQuestionIndex / currentQuestionSet.length * 100) + "%";
    }

    function draw() {
        ctx.clearRect(0,0, canvas.width, canvas.height); ctx.fillStyle = '#222'; ctx.fillRect(0,0, canvas.width, canvas.height);
        ctx.strokeStyle = '#f1c40f'; ctx.setLineDash([40, 40]); ctx.lineDashOffset = -roadOffset; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
        if (arriving) drawHospital(); traffic.forEach(drawCar); drawAmbulance(); requestAnimationFrame(draw);
    }
        
    initializeCloudAssets();
    setInterval(update, 1000/60); draw();
</script>
</body>
</html>
